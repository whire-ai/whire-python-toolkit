name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  test:
    # Same tests and pip-audit as CI, on the exact commit being released.
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test # nothing is uploaded unless every test job passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
